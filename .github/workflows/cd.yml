name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(fromJSON('["develop", "master"]'), github.event.workflow_run.head_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/quantdash-backend:${{ github.event.workflow_run.head_branch }}
            ghcr.io/${{ github.repository_owner }}/quantdash-backend:${{ github.event.workflow_run.head_sha }}

      - name: Tag backend image as latest (master only)
        if: github.event.workflow_run.head_branch == 'master'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/quantdash-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE=${{ secrets.VITE_API_BASE }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/quantdash-frontend:${{ github.event.workflow_run.head_branch }}
            ghcr.io/${{ github.repository_owner }}/quantdash-frontend:${{ github.event.workflow_run.head_sha }}

      - name: Tag frontend image as latest (master only)
        if: github.event.workflow_run.head_branch == 'master'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE=${{ secrets.VITE_API_BASE }}
          tags: ghcr.io/${{ github.repository_owner }}/quantdash-frontend:latest
