name: Deploy

on:
  workflow_run:
    workflows: ["CD"]
    types: [completed]
    branches: [master]

jobs:
  deploy:
    name: Deploy to homeserver
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --accept-routes

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            deployer@${{ secrets.TAILSCALE_SERVER_IP }} << 'ENDSSH'
            set -e
            cd /opt/quantdash

            echo "Logging into GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            echo "Pulling latest images..."
            docker pull ghcr.io/${{ github.repository_owner }}/quantdash-backend:latest
            docker pull ghcr.io/${{ github.repository_owner }}/quantdash-frontend:latest

            echo "Restarting containers..."
            docker compose up -d --pull always --remove-orphans

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Deployment complete!"
            docker ps | grep quantdash
          ENDSSH
